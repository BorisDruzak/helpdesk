# Шаблон настроек агента. При первом запуске копируется в data_root/settings.yaml.
# Фактические пути (data_dir, logs, modules) задаются через runtime_paths (data_root).

server:
  ws_url: "ws://example.test:8666/ws"
  api_url: "http://example.test:8666/api"
  http_port: 12345
  reconnect_interval: 5

security:
  allow_remote_code: false

paths:
  data_dir: "."
  identity_file: "identity.json"
  temp_dir: "temp"

logging:
  level: "INFO"
  file: "logs/agent.log"
  console_level: "INFO"
  rotation: "20 MB"
  retention: "14 days"
  compression: "zip"
  enqueue: true

enabled_modules:
  - "system"
  - "screen"
  - "diag_logs"
  - "inventory"
  - "presence"

ui:
  enabled: True
  host: "127.0.0.1"
  port: 8765
  autostart_gui: True
  tray_enabled: True
  minimize_to_tray: True
  start_hidden: False
  notifications_enabled: True
  theme_mode: "light"

modules:
  extra_paths: []
