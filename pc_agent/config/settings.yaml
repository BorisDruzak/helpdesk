server:
  ws_url: "ws://192.168.100.17:8666/ws"
  api_url: "http://192.168.100.17:8666/api"
  http_port: 12345
  reconnect_interval: 5

security:
  allow_remote_code: true

paths:
  modules_dir: "modules/dynamic"
  data_dir: "data"
  identity_file: "data/identity.json"
  temp_dir: "data/temp"

logging:
  level: "INFO"
  file: "logs/agent.log"
  console_level: "INFO"
  rotation: "20 MB"
  retention: "14 days"
  compression: "zip"
  enqueue: true

enabled_modules:
  - "system"
  - "screen"
  - "diag_logs"
  - "inventory"
  - "presence"

ui:
  enabled: true
  host: "127.0.0.1"
  port: 8766
  autostart_gui: true
  tray_enabled: true
  minimize_to_tray: true
  start_hidden: false
  notifications_enabled: true
  theme_mode: "light"
