<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой тест команд</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        input, textarea {
            padding: 8px;
            margin: 5px;
            background: #252526;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            font-family: monospace;
            font-size: 12px;
        }
        input[type="text"] {
            width: 300px;
        }
        textarea {
            width: 400px;
            height: 60px;
            resize: vertical;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
        }
        .section h2 {
            margin-top: 0;
            color: #4ec9b0;
        }
        #log {
            margin-top: 20px;
            padding: 10px;
            background: #252526;
            border: 1px solid #3e3e42;
            height: 400px;
            overflow-y: auto;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
        .info { color: #9cdcfe; }
        .chat-message {
            margin: 5px 0;
            padding: 5px;
            background: #1e1e1e;
            border-left: 3px solid #4ec9b0;
        }
        .chat-message.from-support { border-left-color: #9cdcfe; }
        .chat-message.from-agent { border-left-color: #4ec9b0; }
    </style>
</head>
<body>
    <h1>🧪 Простой тест команд агента</h1>
    
    <div class="section">
        <h2>📋 Базовые команды</h2>
        <button onclick="testPing()">🏓 Test Ping</button>
        <button onclick="testCollect()">📊 Test Collect</button>
        <button onclick="testInstallModule()">📦 Test Install Module</button>
        <button onclick="testExecScript()">🚀 Test Exec Script</button>
        <button onclick="clearLog()">🗑️ Clear Log</button>
    </div>
    
    <div class="section">
        <h2>💬 Чат-функционал</h2>
        <div>
            <button onclick="testChatStart()">🚀 Start Chat Job</button>
            <span id="jobIdDisplay" style="margin-left: 10px; color: #4ec9b0;"></span>
        </div>
        <div style="margin-top: 10px;">
            <input type="text" id="jobIdInput" placeholder="Job ID (или оставьте пустым для использования текущего)">
            <input type="text" id="chatTextInput" placeholder="Текст сообщения" value="hello">
            <select id="chatFromSelect" style="padding: 8px; background: #252526; border: 1px solid #3e3e42; color: #d4d4d4;">
                <option value="support">support</option>
                <option value="user">user</option>
            </select>
            <button onclick="testChatSend()">📤 Send Message</button>
        </div>
        <div style="margin-top: 10px;">
            <button onclick="testChatEvents()">📜 Get Chat Events</button>
            <button onclick="refreshChatEvents()">🔄 Refresh Events</button>
        </div>
        <div id="chatEvents" style="margin-top: 10px; max-height: 300px; overflow-y: auto; padding: 10px; background: #1e1e1e; border: 1px solid #3e3e42;"></div>
    </div>
    
    <div id="log"></div>
    
    <script>
        const DEVICE_ID = 'test_pc_01';
        let currentJobId = null;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        function updateJobIdDisplay(jobId) {
            currentJobId = jobId;
            const display = document.getElementById('jobIdDisplay');
            if (jobId) {
                display.textContent = `Job ID: ${jobId}`;
                display.style.color = '#4ec9b0';
            } else {
                display.textContent = '';
            }
        }
        
        function displayChatEvents(events) {
            const eventsDiv = document.getElementById('chatEvents');
            if (!events || events.length === 0) {
                eventsDiv.innerHTML = '<div style="color: #888;">Нет событий</div>';
                return;
            }
            
            let html = '';
            events.forEach(event => {
                const eventType = event.event || 'unknown';
                const from = event.from || 'unknown';
                const text = event.text || '';
                const ts = event.ts ? new Date(event.ts * 1000).toLocaleTimeString() : '';
                
                if (eventType === 'chat_message') {
                    const fromClass = from === 'support' ? 'from-support' : (from === 'agent' ? 'from-agent' : '');
                    html += `<div class="chat-message ${fromClass}">
                        <strong>[${ts}] ${from}:</strong> ${text}
                    </div>`;
                } else {
                    html += `<div style="color: #888; margin: 5px 0;">
                        <strong>[${ts}] ${eventType}:</strong> ${JSON.stringify(event)}
                    </div>`;
                }
            });
            eventsDiv.innerHTML = html;
            eventsDiv.scrollTop = eventsDiv.scrollHeight;
        }
        
        async function sendCommand(command, params = {}) {
            log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'info');
            log(`📤 Отправка команды: ${command}`, 'info');
            log(`📋 Device ID: ${DEVICE_ID}`, 'info');
            log(`🔧 Параметры: ${JSON.stringify(params, null, 2)}`, 'info');
            
            const requestData = {
                device_id: DEVICE_ID,
                command: command,
                params: params
            };
            
            try {
                log(`🌐 Отправка HTTP POST на /api/send_command...`, 'info');
                
                const response = await fetch('/api/send_command', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });
                
                log(`📡 HTTP статус: ${response.status}`, response.status === 200 ? 'success' : 'error');
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    log(`✅ Команда выполнена успешно!`, 'success');
                    log(`📨 Ответ: ${JSON.stringify(data, null, 2)}`, 'success');
                } else {
                    log(`❌ Ошибка выполнения команды`, 'error');
                    log(`📨 Ответ: ${JSON.stringify(data, null, 2)}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Исключение JavaScript: ${error.message}`, 'error');
                console.error('Полная ошибка:', error);
            }
        }
        
        async function testPing() {
            await sendCommand('ping');
        }
        
        async function testCollect() {
            await sendCommand('collect', {
                modules: ['system', 'screen']
            });
        }
        
        async function testInstallModule() {
            const code = `from modules.base_module import BaseCollector

class TestCollector(BaseCollector):
    @property
    def name(self):
        return 'test_simple'
    
    async def collect(self):
        return {'message': 'Hello from simple test!', 'timestamp': 123456}`;
            
            await sendCommand('install_module', {
                name: 'test_simple',
                code: code
            });
        }
        
        async function testExecScript() {
            const code = `async def run():
    import time
    return {'result': 'OK', 'timestamp': time.time()}`;
            
            await sendCommand('exec_script', {
                code: code
            });
        }
        
        async function testChatStart() {
            log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'info');
            log(`🚀 Запуск чат-job...`, 'info');
            
            try {
                const response = await fetch('/api/chat_start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        device_id: DEVICE_ID,
                        actor_role: 'admin'
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success' && data.job_id) {
                    log(`✅ Чат-job запущен успешно!`, 'success');
                    log(`📋 Job ID: ${data.job_id}`, 'success');
                    updateJobIdDisplay(data.job_id);
                    
                    // Автоматически обновляем события через 1 секунду
                    setTimeout(() => {
                        refreshChatEvents();
                    }, 1000);
                } else {
                    log(`❌ Ошибка запуска чат-job: ${data.error || 'Unknown error'}`, 'error');
                    log(`📨 Ответ: ${JSON.stringify(data, null, 2)}`, 'error');
                }
            } catch (error) {
                log(`❌ Исключение: ${error.message}`, 'error');
                console.error('Полная ошибка:', error);
            }
        }
        
        async function testChatSend() {
            const jobIdInput = document.getElementById('jobIdInput').value.trim();
            const textInput = document.getElementById('chatTextInput').value.trim();
            const fromSelect = document.getElementById('chatFromSelect').value;
            
            const jobId = jobIdInput || currentJobId;
            
            if (!jobId) {
                log(`❌ Job ID не указан. Сначала запустите чат-job.`, 'error');
                return;
            }
            
            if (!textInput) {
                log(`❌ Текст сообщения не может быть пустым.`, 'error');
                return;
            }
            
            log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'info');
            log(`📤 Отправка сообщения в чат...`, 'info');
            log(`📋 Job ID: ${jobId}`, 'info');
            log(`💬 Текст: ${textInput}`, 'info');
            log(`👤 От: ${fromSelect}`, 'info');
            
            try {
                const response = await fetch('/api/chat_send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        device_id: DEVICE_ID,
                        job_id: jobId,
                        text: textInput,
                        from: fromSelect,
                        actor_role: fromSelect
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    log(`✅ Сообщение отправлено успешно!`, 'success');
                    log(`📋 Message ID: ${data.message_id}`, 'success');
                    
                    // Очищаем поле ввода текста
                    document.getElementById('chatTextInput').value = '';
                    
                    // Обновляем события через 1 секунду
                    setTimeout(() => {
                        refreshChatEvents();
                    }, 1000);
                } else {
                    log(`❌ Ошибка отправки сообщения: ${data.error || 'Unknown error'}`, 'error');
                    log(`📨 Ответ: ${JSON.stringify(data, null, 2)}`, 'error');
                }
            } catch (error) {
                log(`❌ Исключение: ${error.message}`, 'error');
                console.error('Полная ошибка:', error);
            }
        }
        
        async function testChatEvents() {
            const jobIdInput = document.getElementById('jobIdInput').value.trim();
            const jobId = jobIdInput || currentJobId;
            
            if (!jobId) {
                log(`❌ Job ID не указан. Сначала запустите чат-job.`, 'error');
                return;
            }
            
            await refreshChatEvents(jobId);
        }
        
        async function refreshChatEvents(jobId = null) {
            const targetJobId = jobId || document.getElementById('jobIdInput').value.trim() || currentJobId;
            
            if (!targetJobId) {
                displayChatEvents([]);
                return;
            }
            
            try {
                const response = await fetch(`/api/chat_events?job_id=${encodeURIComponent(targetJobId)}&limit=200`);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    log(`📜 Получено ${data.count} событий для job_id=${targetJobId}`, 'info');
                    displayChatEvents(data.events);
                } else {
                    log(`❌ Ошибка получения событий: ${data.error || 'Unknown error'}`, 'error');
                    displayChatEvents([]);
                }
            } catch (error) {
                log(`❌ Исключение при получении событий: ${error.message}`, 'error');
                console.error('Полная ошибка:', error);
                displayChatEvents([]);
            }
        }
        
        // Автоматическое обновление событий каждые 3 секунды
        setInterval(() => {
            if (currentJobId) {
                refreshChatEvents();
            }
        }, 3000);
        
        // При загрузке страницы
        window.addEventListener('load', () => {
            log('✅ Страница загружена', 'success');
            log('📍 Готов к отправке команд', 'success');
            log('💡 Откройте консоль браузера (F12) для детального лога', 'info');
            log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
        });
    </script>
</body>
</html>
