<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Chat Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            height: 100vh;
            overflow: hidden;
        }
        
        .main-container {
            display: flex;
            height: 100vh;
        }
        
        /* Sidebar with agents list */
        .sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .sidebar-header h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        
        .sidebar-header .status {
            font-size: 13px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
        }
        
        .status-indicator.disconnected {
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }
        
        .agents-section {
            flex: 1;
            overflow-y: auto;
        }
        
        .section-title {
            padding: 16px 20px 8px;
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .agent-item {
            padding: 12px 20px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.2s;
            position: relative;
        }
        
        .agent-item:hover {
            background: #f9fafb;
        }
        
        .agent-item.active {
            background: #f0f4ff;
            border-left-color: #667eea;
        }
        
        .agent-item.has-invite {
            background: #fef3c7;
            border-left-color: #f59e0b;
        }
        
        .agent-item .agent-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: #1f2937;
        }
        
        .agent-item .agent-status {
            font-size: 12px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .agent-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .agent-badge.online {
            background: #d1fae5;
            color: #065f46;
        }
        
        .agent-badge.offline {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .agent-badge.chatting {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .invite-badge {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background: #f59e0b;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #e5e7eb;
            background: #f9fafb;
        }
        
        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #4b5563;
            border: 1px solid #d1d5db;
            margin-top: 8px;
        }
        
        .btn-secondary:hover {
            background: #f9fafb;
        }
        
        /* Main chat area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chat-header .title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
        }
        
        .chat-header .subtitle {
            font-size: 13px;
            color: #6b7280;
            margin-top: 2px;
        }
        
        .chat-controls {
            display: flex;
            gap: 8px;
        }
        
        .chat-controls button {
            padding: 8px 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .chat-controls button:hover {
            background: #f9fafb;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9fafb;
        }
        
        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            text-align: center;
        }
        
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }
        
        .empty-state h2 {
            font-size: 20px;
            color: #6b7280;
            margin-bottom: 8px;
        }
        
        .empty-state p {
            font-size: 14px;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        
        .message.support {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: white;
            flex-shrink: 0;
        }
        
        .message.agent .message-avatar {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }
        
        .message.support .message-avatar {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .message.user .message-avatar {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        
        .message-content {
            flex: 1;
            max-width: 70%;
        }
        
        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        
        .message.support .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }
        
        .message.support .message-meta {
            flex-direction: row-reverse;
        }
        
        .event-item {
            margin-bottom: 12px;
            padding: 12px;
            background: white;
            border-left: 3px solid #3b82f6;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .event-item.tool-call {
            border-left-color: #8b5cf6;
        }
        
        .event-item.tool-result {
            border-left-color: #10b981;
        }
        
        .event-item.tool-error {
            border-left-color: #ef4444;
        }
        
        .event-header {
            font-weight: 600;
            margin-bottom: 4px;
            color: #374151;
        }
        
        .event-content {
            color: #6b7280;
        }
        
        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        .input-field {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .input-field textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            transition: border-color 0.2s;
        }
        
        .input-field textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .send-btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Tools Section */
        .tools-section {
            padding: 20px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
        }
        
        .tools-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .tools-header h3 {
            font-size: 14px;
            color: #374151;
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }
        
        .tools-grid select,
        .tools-grid button {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
        }
        
        .tools-grid select {
            background: white;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            display: none;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }
        
        .notification.show {
            display: flex;
        }
        
        .notification.success {
            border-left: 4px solid #10b981;
        }
        
        .notification.error {
            border-left: 4px solid #ef4444;
        }
        
        .notification.info {
            border-left: 4px solid #3b82f6;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Sidebar with agents -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Support Chat</h1>
                <div class="status">
                    <div id="wsIndicator" class="status-indicator disconnected"></div>
                    <span id="wsStatusText">Connecting...</span>
                </div>
            </div>
            
            <div class="agents-section">
                <div class="section-title">Connected Agents</div>
                <div id="agentsList">
                    <!-- Agents will be loaded here -->
                </div>
                
                <div class="section-title" style="margin-top: 20px;">Incoming Invites</div>
                <div id="invitesList">
                    <!-- Invites will be shown here -->
                </div>
            </div>
            
            <div class="sidebar-footer">
                <button class="btn btn-secondary" onclick="window.location.href='/web_interface.html'">
                    ← Back to Dashboard
                </button>
            </div>
        </div>
        
        <!-- Chat area -->
        <div class="chat-container">
            <div class="chat-header">
                <div>
                    <div class="title" id="chatTitle">Support Chat</div>
                    <div class="subtitle" id="chatSubtitle">Select an agent to start chatting</div>
                </div>
                <div class="chat-controls">
                    <button onclick="loadTools()" id="refreshToolsBtn" disabled>🔄 Refresh Tools</button>
                    <button onclick="clearChat()" id="clearChatBtn" disabled>🗑️ Clear</button>
                </div>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <h2>No Active Chat</h2>
                    <p>Select an agent from the sidebar or wait for incoming chat invites</p>
                </div>
            </div>
            
            <div class="tools-section" id="toolsSection" style="display: none;">
                <div class="tools-header">
                    <h3>Quick Tools</h3>
                </div>
                <div class="tools-grid">
                    <select id="toolSelect" disabled>
                        <option value="">Select a tool...</option>
                    </select>
                    <button onclick="runTool()" id="runToolBtn" disabled>Run Tool</button>
                </div>
            </div>
            
            <div class="input-container">
                <div class="input-wrapper">
                    <div class="input-field">
                        <textarea 
                            id="messageInput" 
                            placeholder="Type your message... (Ctrl+Enter to send)" 
                            disabled
                        ></textarea>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                        Send →
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Notification -->
    <div class="notification" id="notification">
        <span id="notificationText"></span>
    </div>

    <script>
        // ===== Global State =====
        let wsClient = null;
        let currentJobId = null;
        let currentDeviceId = null;
        let availableTools = [];
        let connectedAgents = {};
        let pendingInvites = {};
        
        // ===== WebSocket Client =====
        class ChatWsClient {
            constructor(wsUrl = "ws://localhost:8666/ws_ui") {
                this.wsUrl = wsUrl;
                this.ws = null;
                this.connectionId = null;
                this.subscribedChats = new Set();
                this.eventHandlers = {};
                this.reconnectTimer = null;
                this.connectionState = 'disconnected';
            }
            
            connect() {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    console.log("[WS] Already connected");
                    return;
                }
                
                this.connectionState = 'connecting';
                this.updateConnectionStatus();
                
                console.log(`[WS] Connecting to ${this.wsUrl}...`);
                this.ws = new WebSocket(this.wsUrl);
                
                this.ws.onopen = () => {
                    console.log("[WS] Connected");
                    this.connectionState = 'connected';
                    this.updateConnectionStatus();
                    
                    // Отправляем ui_hello
                    this.send({
                        type: "ui_hello",
                        role: "support"
                    });
                };
                
                this.ws.onmessage = (evt) => {
                    try {
                        const msg = JSON.parse(evt.data);
                        this.handleMessage(msg);
                    } catch (error) {
                        console.error("[WS] Failed to parse message:", error, evt.data);
                    }
                };
                
                this.ws.onerror = (err) => {
                    console.error("[WS] Error:", err);
                    this.connectionState = 'disconnected';
                    this.updateConnectionStatus();
                };
                
                this.ws.onclose = (evt) => {
                    console.log(`[WS] Closed (code: ${evt.code}, reason: ${evt.reason})`);
                    this.connectionState = 'disconnected';
                    this.updateConnectionStatus();
                    this.connectionId = null;
                    
                    // Реконнект через 3 секунды
                    if (this.reconnectTimer) {
                        clearTimeout(this.reconnectTimer);
                    }
                    this.reconnectTimer = setTimeout(() => {
                        console.log("[WS] Reconnecting...");
                        this.connect();
                    }, 3000);
                };
            }
            
            disconnect() {
                if (this.reconnectTimer) {
                    clearTimeout(this.reconnectTimer);
                    this.reconnectTimer = null;
                }
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
                this.connectionState = 'disconnected';
                this.updateConnectionStatus();
            }
            
            updateConnectionStatus() {
                const indicator = document.getElementById('wsIndicator');
                const statusText = document.getElementById('wsStatusText');
                
                if (!indicator || !statusText) return;
                
                if (this.connectionState === 'connected') {
                    indicator.className = 'status-indicator';
                    statusText.textContent = 'Connected';
                } else if (this.connectionState === 'connecting') {
                    indicator.className = 'status-indicator disconnected';
                    statusText.textContent = 'Connecting...';
                } else {
                    indicator.className = 'status-indicator disconnected';
                    statusText.textContent = 'Disconnected';
                }
            }
            
            handleMessage(msg) {
                const msgType = msg.type;
                
                console.log(`[WS] Received: ${msgType}`, msg);
                
                if (msgType === "ui_hello_ack") {
                    this.connectionId = msg.connection_id;
                    console.log(`[WS] Authenticated as ${msg.role}, connection_id=${this.connectionId}`);
                    this.updateConnectionStatus();
                    
                    // Загружаем список агентов
                    loadAgents();
                    
                    // Переподписываемся на все активные чаты
                    this.subscribedChats.forEach(jobId => {
                        this.send({
                            type: "subscribe_chat",
                            job_id: jobId
                        });
                    });
                }
                else if (msgType === "chat_event") {
                    const jobId = msg.job_id;
                    const event = msg.event;
                    
                    // Обрабатываем chat_invite
                    if (event.event === 'chat_invite') {
                        handleIncomingInvite(event);
                    }
                    
                    // Вызываем handler для этого чата
                    if (this.eventHandlers[jobId]) {
                        this.eventHandlers[jobId](event);
                    }
                }
                else if (msgType === "subscribe_ack") {
                    console.log(`[WS] Subscribed to chat ${msg.job_id}`);
                }
                else if (msgType === "error") {
                    console.error(`[WS] Server error:`, msg);
                    showNotification(`WebSocket Error: ${msg.error || 'Unknown error'}`, 'error');
                }
                else {
                    console.log(`[WS] Unhandled message type: ${msgType}`, msg);
                }
            }
            
            send(data) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    const jsonData = JSON.stringify(data);
                    console.log(`[WS] Sending:`, data);
                    this.ws.send(jsonData);
                } else {
                    console.error("[WS] Cannot send - not connected", data);
                    throw new Error("WebSocket not connected");
                }
            }
            
            subscribeChat(jobId, callback) {
                this.subscribedChats.add(jobId);
                this.eventHandlers[jobId] = callback;
                
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.send({
                        type: "subscribe_chat",
                        job_id: jobId
                    });
                }
            }
            
            unsubscribeChat(jobId) {
                this.subscribedChats.delete(jobId);
                delete this.eventHandlers[jobId];
                
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.send({
                        type: "unsubscribe_chat",
                        job_id: jobId
                    });
                }
            }
            
            chatSend(jobId, text, from = "support") {
                this.send({
                    type: "chat_send",
                    job_id: jobId,
                    text: text,
                    from: from
                });
            }
            
            runTool(deviceId, tool, params, chatJobId) {
                this.send({
                    type: "run_tool",
                    device_id: deviceId,
                    tool: tool,
                    params: params,
                    chat_job_id: chatJobId
                });
            }
        }
        
        // ===== UI Functions =====
        function showNotification(text, type = 'info') {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notificationText');
            
            notificationText.textContent = text;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }
        
        async function loadAgents() {
            try {
                const response = await fetch('/api/list_devices');
                const data = await response.json();
                
                if (data.status === 'success' && Array.isArray(data.devices)) {
                    renderAgentsList(data.devices);
                } else {
                    console.error('Failed to load agents:', data);
                }
            } catch (error) {
                console.error('Error loading agents:', error);
                showNotification('Failed to load agents list', 'error');
            }
        }
        
        function renderAgentsList(devices) {
            const agentsList = document.getElementById('agentsList');
            connectedAgents = {};
            
            if (!devices || devices.length === 0) {
                agentsList.innerHTML = '<div style="padding:20px;text-align:center;color:#9ca3af;font-size:13px;">No agents connected</div>';
                return;
            }
            
            agentsList.innerHTML = '';
            
            devices.forEach(device => {
                connectedAgents[device.device_id] = device;
                
                const isActive = currentDeviceId === device.device_id;
                const hasInvite = pendingInvites[device.device_id];
                
                const agentItem = document.createElement('div');
                agentItem.className = `agent-item ${isActive ? 'active' : ''} ${hasInvite ? 'has-invite' : ''}`;
                agentItem.onclick = () => selectAgent(device.device_id, device.hostname);
                
                const statusBadge = device.is_online ? 
                    '<span class="agent-badge online">● Online</span>' :
                    '<span class="agent-badge offline">● Offline</span>';
                
                agentItem.innerHTML = `
                    <div class="agent-name">${device.hostname || device.device_id}</div>
                    <div class="agent-status">
                        ${statusBadge}
                        <span>${device.device_id.substring(0, 12)}...</span>
                    </div>
                    ${hasInvite ? '<div class="invite-badge">New Chat!</div>' : ''}
                `;
                
                agentsList.appendChild(agentItem);
            });
        }
        
        function handleIncomingInvite(event) {
            const deviceId = event.device_id;
            const jobId = event.job_id;
            
            console.log('[UI] Incoming chat invite:', deviceId, jobId);
            
            // Сохраняем приглашение
            pendingInvites[deviceId] = {
                job_id: jobId,
                event: event,
                received_at: Date.now()
            };
            
            // Обновляем список агентов
            loadAgents();
            
            // Показываем уведомление
            showNotification(`Chat invite from ${event.device_id}`, 'info');
            
            // Если список приглашений пуст, добавляем
            renderInvitesList();
        }
        
        function renderInvitesList() {
            const invitesList = document.getElementById('invitesList');
            const invites = Object.values(pendingInvites);
            
            if (invites.length === 0) {
                invitesList.innerHTML = '<div style="padding:20px;text-align:center;color:#9ca3af;font-size:13px;">No pending invites</div>';
                return;
            }
            
            invitesList.innerHTML = '';
            
            invites.forEach(invite => {
                const inviteItem = document.createElement('div');
                inviteItem.className = 'agent-item has-invite';
                inviteItem.onclick = () => acceptInvite(invite.event.device_id, invite.job_id);
                
                const agent = connectedAgents[invite.event.device_id];
                const agentName = agent?.hostname || invite.event.device_id;
                
                inviteItem.innerHTML = `
                    <div class="agent-name">${agentName}</div>
                    <div class="agent-status">
                        <span style="color: #f59e0b;">● ${invite.event.title || 'Support Request'}</span>
                    </div>
                    <div class="invite-badge">Accept</div>
                `;
                
                invitesList.appendChild(inviteItem);
            });
        }
        
        function acceptInvite(deviceId, jobId) {
            console.log('[UI] Accepting invite from', deviceId, 'job_id:', jobId);
            
            // Удаляем из pending
            delete pendingInvites[deviceId];
            
            // Открываем чат
            openChat(deviceId, jobId);
            
            // Обновляем списки
            loadAgents();
            renderInvitesList();
        }
        
        async function selectAgent(deviceId, hostname) {
            console.log('[UI] Agent selected:', deviceId);
            
            // Проверяем, есть ли pending invite
            if (pendingInvites[deviceId]) {
                acceptInvite(deviceId, pendingInvites[deviceId].job_id);
                return;
            }
            
            // Инициируем новый чат
            try {
                const response = await fetch('/api/chat_start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        device_id: deviceId,
                        actor_role: 'support'
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success' && data.job_id) {
                    openChat(deviceId, data.job_id, hostname);
                    showNotification('Chat started successfully!', 'success');
                } else {
                    showNotification('Failed to start chat: ' + (data.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                console.error('[UI] Error starting chat:', error);
                showNotification('Error starting chat: ' + error.message, 'error');
            }
        }
        
        function openChat(deviceId, jobId, hostname) {
            currentDeviceId = deviceId;
            currentJobId = jobId;
            
            // Обновляем заголовок
            const agent = connectedAgents[deviceId];
            const agentName = hostname || agent?.hostname || deviceId;
            document.getElementById('chatTitle').textContent = `Chat with ${agentName}`;
            document.getElementById('chatSubtitle').textContent = `Job ID: ${jobId}`;
            
            // Включаем ввод
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('refreshToolsBtn').disabled = false;
            document.getElementById('clearChatBtn').disabled = false;
            document.getElementById('toolSelect').disabled = false;
            document.getElementById('runToolBtn').disabled = false;
            
            // Показываем секцию инструментов
            document.getElementById('toolsSection').style.display = 'block';
            
            // Очищаем сообщения
            const messagesContainer = document.getElementById('messagesContainer');
            messagesContainer.innerHTML = '';
            
            // Подписываемся на события
            if (wsClient && wsClient.connectionState === 'connected') {
                wsClient.subscribeChat(jobId, (event) => {
                    console.log("Chat event:", event);
                    renderChatEvent(event);
                });
                
                // Загружаем историю
                loadChatHistory(jobId);
                
                // Загружаем инструменты
                loadTools();
            }
            
            // Обновляем список агентов
            loadAgents();
        }
        
        async function loadChatHistory(jobId) {
            try {
                const response = await fetch(`http://localhost:8666/api/chat_events?job_id=${jobId}&limit=100&format=normalized`);
                const data = await response.json();
                
                if (data.status === 'success' && Array.isArray(data.events)) {
                    data.events.forEach(event => {
                        renderChatEvent(event, false);
                    });
                }
            } catch (error) {
                console.error('Error loading chat history:', error);
            }
        }
        
        function renderChatEvent(event, scroll = true) {
            const messagesContainer = document.getElementById('messagesContainer');
            const type = event.type || event.event || 'unknown';
            
            let messageHtml = '';
            
            if (type === 'chat_message') {
                const from = event.payload?.from || event.from || 'unknown';
                const text = event.payload?.text || event.payload?.message || event.text || '';
                const ts = event.ts || event.payload?.ts || Date.now() / 1000;
                const timeStr = new Date(ts * 1000).toLocaleTimeString();
                
                const avatarLetter = from.charAt(0).toUpperCase();
                
                messageHtml = `
                    <div class="message ${from}">
                        <div class="message-avatar">${avatarLetter}</div>
                        <div class="message-content">
                            <div class="message-bubble">${escapeHtml(text)}</div>
                            <div class="message-meta">
                                <span>${from}</span>
                                <span>•</span>
                                <span>${timeStr}</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (type.startsWith('tool_')) {
                const toolName = event.payload?.tool || 'unknown';
                let content = '';
                let eventClass = type.replace(/_/g, '-');
                
                if (type === 'tool_call') {
                    content = `Tool Call: <strong>${toolName}</strong>`;
                } else if (type === 'tool_progress') {
                    const progress = event.payload?.progress || 0;
                    content = `Tool Progress: <strong>${toolName}</strong> - ${progress}%`;
                } else if (type === 'tool_result') {
                    const status = event.payload?.status || 'unknown';
                    content = `Tool Result: <strong>${toolName}</strong> - ${status}`;
                } else if (type === 'tool_error') {
                    const error = event.payload?.error || 'Unknown error';
                    content = `Tool Error: <strong>${toolName}</strong> - ${escapeHtml(error)}`;
                }
                
                messageHtml = `
                    <div class="event-item ${eventClass}">
                        <div class="event-header">${type}</div>
                        <div class="event-content">${content}</div>
                    </div>
                `;
            }
            
            if (messageHtml) {
                messagesContainer.insertAdjacentHTML('beforeend', messageHtml);
                
                if (scroll) {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function sendMessage() {
            if (!currentJobId || !wsClient || wsClient.connectionState !== 'connected') {
                showNotification('Cannot send message - not connected to chat', 'error');
                return;
            }
            
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (!message) {
                return;
            }
            
            try {
                wsClient.chatSend(currentJobId, message, 'support');
                messageInput.value = '';
                messageInput.style.height = 'auto';
                showNotification('Message sent!', 'success');
            } catch (error) {
                console.error('Error sending message:', error);
                showNotification('Error sending message: ' + error.message, 'error');
            }
        }
        
        async function loadTools() {
            if (!currentDeviceId) {
                showNotification('No device selected', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/list_tools', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        device_id: currentDeviceId,
                        actor_role: 'admin'
                    })
                });
                
                const data = await response.json();
                
                let toolsList = [];
                if (data.status === 'success' && data.data && data.data.observations && Array.isArray(data.data.observations.tools)) {
                    toolsList = data.data.observations.tools.map(tool => ({
                        tool: tool.name,
                        module: tool.module,
                        spec: {
                            description: tool.description || 'No description',
                            risk_level: tool.risk_level,
                            capabilities: tool.capabilities,
                            params_schema: tool.params_schema || {},
                            metadata: tool.metadata
                        }
                    }));
                } else if (data.status === 'ok' && Array.isArray(data.tools)) {
                    toolsList = data.tools;
                }
                
                if (toolsList.length > 0) {
                    availableTools = toolsList;
                    const toolSelect = document.getElementById('toolSelect');
                    
                    toolSelect.innerHTML = '<option value="">Select a tool...</option>';
                    
                    toolsList.forEach(tool => {
                        const option = document.createElement('option');
                        option.value = tool.tool;
                        option.textContent = `${tool.tool} - ${tool.spec.description || 'No description'}`;
                        toolSelect.appendChild(option);
                    });
                    
                    showNotification(`Loaded ${toolsList.length} tools`, 'success');
                } else {
                    showNotification('No tools available', 'error');
                }
            } catch (error) {
                console.error('Error loading tools:', error);
                showNotification('Error loading tools: ' + error.message, 'error');
            }
        }
        
        async function runTool() {
            if (!currentDeviceId || !currentJobId) {
                showNotification('No active chat', 'error');
                return;
            }
            
            if (!wsClient || wsClient.connectionState !== 'connected') {
                showNotification('WebSocket not connected', 'error');
                return;
            }
            
            const toolName = document.getElementById('toolSelect').value;
            
            if (!toolName) {
                showNotification('Please select a tool', 'error');
                return;
            }
            
            try {
                wsClient.runTool(currentDeviceId, toolName, {}, currentJobId);
                showNotification(`Tool ${toolName} execution requested`, 'success');
            } catch (error) {
                console.error('Error running tool:', error);
                showNotification('Error running tool: ' + error.message, 'error');
            }
        }
        
        function clearChat() {
            const messagesContainer = document.getElementById('messagesContainer');
            messagesContainer.innerHTML = '';
            showNotification('Chat cleared', 'info');
        }
        
        // ===== Event Handlers =====
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                sendMessage();
            }
        });
        
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
        
        // ===== Initialization =====
        window.addEventListener('DOMContentLoaded', () => {
            console.log("[UI] Initializing Chat Interface...");
            
            // Определяем WebSocket URL
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.hostname;
            const port = window.location.port || (protocol === 'wss:' ? '443' : '80');
            const wsUrl = `${protocol}//${host}:${port}/ws_ui`;
            
            console.log(`[UI] WebSocket URL: ${wsUrl}`);
            
            // Создаем и подключаем клиент
            wsClient = new ChatWsClient(wsUrl);
            wsClient.connect();
            
            // Проверяем URL параметры
            const urlParams = new URLSearchParams(window.location.search);
            const deviceId = urlParams.get('device_id');
            const jobId = urlParams.get('job_id');
            
            if (deviceId && jobId) {
                // Если есть параметры, открываем чат после подключения
                console.log('[UI] Auto-opening chat from URL params:', { deviceId, jobId });
                
                setTimeout(() => {
                    if (wsClient && wsClient.connectionState === 'connected') {
                        openChat(deviceId, jobId);
                    } else {
                        // Повторная попытка
                        setTimeout(() => {
                            if (wsClient && wsClient.connectionState === 'connected') {
                                openChat(deviceId, jobId);
                            }
                        }, 2000);
                    }
                }, 500);
            } else if (deviceId) {
                // Только device_id - нужно инициировать новый чат
                setTimeout(() => {
                    if (wsClient && wsClient.connectionState === 'connected') {
                        selectAgent(deviceId, null);
                    }
                }, 1000);
            }
        });
        
        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (wsClient) {
                wsClient.disconnect();
            }
        });
    </script>
</body>
</html>
