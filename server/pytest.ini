[pytest]
norecursedirs = test_modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    unit: pure in-process unit tests
    integration: tests that exercise app boundaries or multiple components
    agent_ws: tests that start the in-process WS agent fixture
    manual: manual or exploratory suites excluded from default CI runs
    no_db: pure unit tests that must not require PostgreSQL fixtures or migrations
    migration_clone: DB test owns its fresh isolated Alembic revision path and suppresses global head/cleanup setup
