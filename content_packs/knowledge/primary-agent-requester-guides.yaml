  - slug: create-ticket-for-colleague
    type: article
    space: it-self-service
    title: "Как создать обращение за другого сотрудника"
    summary: "Когда форма разрешает обращение за коллегу и почему диагностика пойдет на его основное устройство."
    visibility: requester
    status: published
    owner: servicedesk
    reviewer: servicedesk
    review_due_days: 90
    tags: [requester, on_behalf, primary_device]
    bindings:
      - service_code: other
        offering_code: other.unknown
        request_template_key: general_request
        weight: 1.0
    body_format: markdown
    body: |
      ## Назначение
      Помочь создать обращение за коллегу, если форма прямо разрешает такой сценарий.
      ## Когда использовать
      Используйте, когда проблема у другого сотрудника, а вы создаете обращение от своего аккаунта: например, коллега не может войти, находится рядом или попросил передать обращение.
      ## Шаги
      1. Откройте кабинет пользователя и выберите форму, где есть пункт «Проблема у другого сотрудника».
      2. Включите этот пункт и найдите сотрудника по имени, почте или рабочему контексту.
      3. Укажите причину, если форма просит объяснить, почему обращение создаете вы.
      4. Опишите проблему обычным языком и не добавляйте пароли, коды подтверждения или секретные данные.
      5. Перед отправкой проверьте, что выбран именно сотрудник, у которого возникла проблема.
      ## Проверка результата
      В обращении видно, что вы его создали, а проблема относится к выбранному сотруднику. Диагностика будет направлена на основное устройство этого сотрудника, если оно известно и доступно.
      ## Если не помогло
      Если нужного сотрудника найти не удалось или у него нет основного устройства, отправьте обращение только через форму, которая разрешает ручную обработку, или обратитесь в поддержку.
      ## Связанные услуги / типы обращения
      Другое / Не знаю, помощь с доступом, рабочее место.
  - slug: pc-does-not-power-on
    type: article
    space: it-self-service
    title: "Что делать, если мой ПК не включается"
    summary: "Безопасные действия перед обращением, когда компьютер не запускается и диагностика агента может быть недоступна."
    visibility: requester
    status: published
    owner: servicedesk
    reviewer: servicedesk
    review_due_days: 90
    tags: [workplace, power, emergency]
    bindings:
      - service_code: workplace
        offering_code: workplace.laptop_broken
        request_template_key: breakage
        weight: 1.0
    body_format: markdown
    body: |
      ## Назначение
      Помочь безопасно собрать первичную информацию, если рабочий ПК или ноутбук не включается.
      ## Когда использовать
      Используйте, если устройство не подает признаков включения, экран остается черным или работа невозможна до прихода специалиста.
      ## Шаги
      1. Проверьте питание: розетку, блок питания, кабель и индикатор зарядки.
      2. Если это ноутбук, подключите зарядку и подождите несколько минут.
      3. Не разбирайте устройство и не используйте поврежденные кабели.
      4. Если есть запах гари, следы жидкости или перегрев, отключите питание и не пытайтесь включать устройство снова.
      5. Создайте обращение с контактным телефоном и кратко опишите, что видно на устройстве.
      ## Проверка результата
      Если устройство включилось, дождитесь загрузки и опишите, повторяется ли проблема. Если не включилось, обращение уйдет на ручную обработку, потому что удаленная диагностика может быть недоступна.
      ## Если не помогло
      Отправьте обращение через аварийную форму или сообщите руководителю, если устройство нужно заменить срочно.
      ## Связанные услуги / типы обращения
      Рабочее место / Сломался ноутбук.
  - slug: request-device-owner-change
    type: article
    space: it-self-service
    title: "Как запросить смену владельца устройства"
    summary: "Что делать, если устройство закреплено не за тем сотрудником или перешло к другому пользователю."
    visibility: requester
    status: published
    owner: servicedesk
    reviewer: servicedesk
    review_due_days: 90
    tags: [device_link, ownership, registry]
    bindings:
      - service_code: other
        offering_code: other.unknown
        request_template_key: general_request
        weight: 1.0
    body_format: markdown
    body: |
      ## Назначение
      Объяснить, как запросить проверку владельца устройства без самостоятельной перепривязки.
      ## Когда использовать
      Используйте, если устройство показывается за другим сотрудником, было передано вам, вернулось из ремонта или больше не должно быть вашим основным устройством.
      ## Шаги
      1. Не выходите из своего аккаунта на чужих данных и не просите коллегу передавать пароль.
      2. Откройте кабинет пользователя и создайте обращение на смену владельца или ручную проверку устройства.
      3. Укажите, кто сейчас пользуется устройством и что изменилось: передача, замена, ремонт или ошибка в учете.
      4. Дождитесь проверки администратора. Поддержка может сверить данные и перенести привязку с причиной и аудитом.
      ## Проверка результата
      После подтверждения устройство отображается у правильного сотрудника, а новые обращения диагностируются по его основному устройству.
      ## Если не помогло
      Если устройство нужно использовать срочно, создайте отдельное обращение и укажите контакт для связи. Поддержка обработает его вручную.
      ## Связанные услуги / типы обращения
      Другое / Не знаю, рабочее место.
  - slug: link-device-to-account
    type: article
    space: it-self-service
    title: "Как привязать устройство к аккаунту"
    summary: "Как связать свой веб-аккаунт с рабочим устройством через кабинет пользователя. Профиль можно заполнить до или после привязки."
    visibility: requester
    status: published
    owner: servicedesk
    reviewer: servicedesk
    review_due_days: 90
    tags: [device_link, account, registration]
    bindings:
      - service_code: other
        offering_code: other.unknown
        request_template_key: agent_binding_help
        weight: 1.0
    body_format: markdown
    body: |
      ## Назначение
      Показать безопасный путь привязки устройства к вашему аккаунту.
      ## Когда использовать
      Используйте после входа в веб-кабинет, если рабочее устройство еще не связано с вашим профилем или агент показывает код привязки.
      ## Шаги
      1. Войдите в кабинет пользователя своим аккаунтом.
      2. Откройте раздел устройств и введите код привязки, который показывает агент на рабочем компьютере, или перейдите по ссылке из агента.
      3. Проверьте название устройства и подтвердите привязку.
      4. Заполните профиль в кабинете пользователя, если он еще не заполнен. Привязка устройства и заполнение профиля - отдельные шаги.
      5. Дождитесь проверки администратора, если политика требует подтверждения.
      ## Проверка результата
      В кабинете появляется состояние привязки устройства. После подтверждения обычные обращения будут использовать ваше основное устройство для диагностики.
      ## Если не помогло
      Если код истек, запросите новый код в агенте. Если устройство показывает чужой аккаунт, создайте обращение на проверку владельца устройства.
      ## Связанные услуги / типы обращения
      Другое / Не знаю, рабочее место.
  - slug: complete-requester-profile
    type: article
    space: it-self-service
    title: "Как заполнить профиль пользователя"
    summary: "Какие данные нужны в кабинете пользователя и почему без них обычные обращения могут быть недоступны."
    visibility: requester
    status: published
    owner: servicedesk
    reviewer: servicedesk
    review_due_days: 90
    tags: [profile, account, requester]
    bindings:
      - service_code: other
        offering_code: other.unknown
        request_template_key: profile_completion_help
        weight: 1.0
    body_format: markdown
    body: |
      ## Назначение
      Помочь заполнить профиль пользователя в веб-кабинете.
      ## Когда использовать
      Используйте, если кабинет показывает, что профиль не заполнен, или обычные обращения пока недоступны.
      ## Шаги
      1. Откройте кабинет пользователя и перейдите к блоку профиля.
      2. Укажите ФИО, подразделение, локацию и телефон или внутренний номер.
      3. Если есть дополнительные поля, заполните только видимые поля, которые просит кабинет.
      4. Сохраните профиль и проверьте, что предупреждение о незаполненном профиле исчезло.
      5. Если устройство еще не привязано, привяжите его отдельно в разделе устройств.
      ## Проверка результата
      После сохранения профиль считается заполненным, а обычные обращения используют ваши рабочие данные для маршрутизации и диагностики.
      ## Если не помогло
      Если нужного подразделения или локации нет в списке, отправьте разрешенную форму помощи или обратитесь в поддержку.
      ## Связанные услуги / типы обращения
      Другое / Не знаю, доступ к кабинету пользователя.
