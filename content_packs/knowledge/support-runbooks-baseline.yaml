items:
  - slug: support-vpn-primary-diagnostics
    type: runbook
    space: it-support
    title: "Первичная диагностика VPN"
    summary: "Generic support checklist for VPN triage; adapt environment-specific details during review."
    visibility: support_internal
    status: in_review
    owner: servicedesk
    reviewer: servicedesk
    tags: [vpn, support_runbook]
    bindings:
      - service_code: network
        offering_code: network.vpn_issue
    body_format: markdown
    body: |
      ## Scope
      Primary triage for VPN connectivity issues.
      ## Preconditions
      Confirm requester identity through the approved support process.
      ## Required access
      Use only approved support systems. Add environment-specific references during review.
      ## Steps
      1. Confirm symptom, time window and affected network.
      2. Check whether the issue is single-user or broader.
      3. Collect safe error text and screenshots when available.
      ## Validation
      User can connect and reach expected resources.
      ## Rollback
      Revert any temporary support-side changes according to the approved local procedure.
      ## Evidence to collect
      Time, symptom, safe error text, network type and affected scope.
      ## Escalation
      Escalate with collected evidence when primary checks do not isolate the cause.
  - slug: support-laptop-primary-diagnostics
    type: runbook
    space: it-support
    title: "Первичная диагностика ноутбука"
    summary: "Generic support checklist for laptop power and startup triage."
    visibility: support_internal
    status: in_review
    owner: servicedesk
    reviewer: servicedesk
    tags: [laptop, support_runbook]
    bindings:
      - service_code: workplace
        offering_code: workplace.laptop_issue
    body_format: markdown
    body: |
      ## Scope
      Primary triage for laptop power, boot and display symptoms.
      ## Preconditions
      Confirm that requester has completed safe user-facing checks.
      ## Required access
      Approved support inventory and ticket workspace.
      ## Steps
      1. Identify whether the device powers on, charges or shows display output.
      2. Ask about recent drop, liquid contact or accessory changes.
      3. Decide whether remote help, desk-side support or replacement workflow is appropriate.
      ## Validation
      Device starts or a clear next support action is documented.
      ## Rollback
      Remove temporary accessories or test changes if used.
      ## Evidence to collect
      Model, visible indicators, recent events and safe screenshots.
      ## Escalation
      Escalate hardware risk according to local process.
  - slug: support-mail-primary-diagnostics
    type: runbook
    space: it-support
    title: "Первичная диагностика почты"
    summary: "Generic support checklist for mail access, sending and receiving issues."
    visibility: support_internal
    status: in_review
    owner: servicedesk
    reviewer: servicedesk
    tags: [mail, support_runbook]
    bindings:
      - service_code: communications
        offering_code: communications.mail_issue
    body_format: markdown
    body: |
      ## Scope
      Primary triage for email availability, delivery and client symptoms.
      ## Preconditions
      Requester describes whether the issue affects sign-in, sending, receiving or attachments.
      ## Required access
      Approved support view of mail service status and ticket history.
      ## Steps
      1. Determine single-user versus broader impact.
      2. Compare client and browser behavior when allowed.
      3. Collect safe error text and message timing.
      ## Validation
      Mail flow is restored or next owner is clear.
      ## Rollback
      Revert temporary client-side changes if applied.
      ## Evidence to collect
      Symptom type, time, affected mailbox and safe error text.
      ## Escalation
      Escalate service-wide symptoms through the approved path.
  - slug: support-printer-primary-diagnostics
    type: runbook
    space: it-support
    title: "Первичная диагностика принтера"
    summary: "Generic support checklist for printer and queue triage."
    visibility: support_internal
    status: in_review
    owner: servicedesk
    reviewer: servicedesk
    tags: [printer, support_runbook]
    bindings:
      - service_code: workplace
        offering_code: workplace.printer_issue
    body_format: markdown
    body: |
      ## Scope
      Primary triage for printing failures.
      ## Preconditions
      Requester identifies the printer label or location.
      ## Required access
      Approved support printer inventory or queue view, if available.
      ## Steps
      1. Determine whether one user or many users are affected.
      2. Check visible device state reported by requester.
      3. Confirm whether a small test document prints.
      ## Validation
      Print succeeds or issue is routed to the correct support owner.
      ## Rollback
      Revert temporary printer selection or test changes.
      ## Evidence to collect
      Printer name/location, visible status and affected scope.
      ## Escalation
      Escalate device or service-wide issues according to local process.
  - slug: support-other-unknown-triage
    type: runbook
    space: it-support
    title: "Проверка заявки \"Другое / Не знаю\""
    summary: "Generic triage checklist for unclear category requests."
    visibility: support_internal
    status: in_review
    owner: servicedesk
    reviewer: servicedesk
    tags: [other, triage, support_runbook]
    bindings:
      - service_code: other
        offering_code: other.unknown
    body_format: markdown
    body: |
      ## Scope
      Triage requests where the requester does not know the service category.
      ## Preconditions
      Ticket contains a safe problem description.
      ## Required access
      Ticket workspace and Service Catalog.
      ## Steps
      1. Identify user goal, expected result and actual result.
      2. Map the request to the nearest service/offering.
      3. Ask one focused clarifying question if needed.
      ## Validation
      Ticket has the correct service/offering or a clear escalation path.
      ## Rollback
      Revert wrong categorization if later evidence changes the classification.
      ## Evidence to collect
      Goal, symptom, affected system and safe error text.
      ## Escalation
      Escalate unclear or cross-service cases to the designated triage owner.
