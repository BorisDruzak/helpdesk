items:
  - slug: vpn-reconnect-basic
    type: article
    space: it-self-service
    title: Как переподключить VPN
    summary: Безопасная инструкция для пользователя при сбое VPN.
    visibility: requester
    status: published
    owner: servicedesk
    reviewer: servicedesk
    tags: [vpn, remote_work]
    review_due_days: 90
    bindings:
      - service_code: network
        offering_code: network.vpn_issue
        weight: 1.0
    body_format: markdown
    body: |
      ## Когда использовать

      Используйте эту инструкцию, если VPN не подключается или соединение разорвалось.

      ## Шаги

      1. Отключите VPN.
      2. Подождите 30 секунд.
      3. Подключитесь снова.
      4. Если ошибка повторяется, создайте обращение.
    quality:
      source: baseline_pack
      reviewed: true
  - slug: vpn-support-triage-runbook
    type: runbook
    space: support-runbooks
    title: VPN support triage runbook
    summary: Support-only checklist for VPN incidents.
    visibility: support_internal
    status: published
    owner: servicedesk
    reviewer: servicedesk
    tags: [vpn, support]
    review_due_days: 90
    bindings:
      - service_code: network
        offering_code: network.vpn_issue
        weight: 1.0
    body_format: markdown
    body: |
      ## Symptoms

      VPN client cannot establish a connection after basic requester self-service.

      ## Checks

      1. Confirm the requester tried the requester-safe VPN article.
      2. Check service status and recent network incidents.
      3. Escalate to the network queue when multiple users are affected.
    quality:
      source: baseline_pack
      reviewed: true
