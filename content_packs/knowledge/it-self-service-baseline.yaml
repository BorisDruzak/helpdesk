items:
  - slug: vpn-basic-checks
    type: article
    space: it-self-service
    title: "VPN не подключается: базовые проверки"
    summary: "Безопасные проверки перед созданием обращения по VPN."
    visibility: requester
    status: published
    owner: servicedesk
    reviewer: servicedesk
    review_due_days: 90
    tags: [vpn, remote_work]
    bindings:
      - service_code: network
        offering_code: network.vpn_issue
        request_template_key: network
        weight: 1.0
    body_format: markdown
    body: |
      ## Назначение
      Помочь пользователю проверить базовые причины, по которым VPN может не подключаться.
      ## Когда использовать
      Используйте перед созданием обращения, если VPN не подключается или соединение сразу разрывается.
      ## Шаги
      1. Проверьте, что интернет работает в браузере.
      2. Убедитесь, что дата и время на устройстве выглядят корректно.
      3. Закройте VPN-приложение и откройте его снова обычным способом.
      4. Проверьте, не включен ли режим полета или ограничение сети.
      5. Попробуйте подключиться еще раз.
      ## Проверка результата
      VPN показывает подключенное состояние, а рабочие ресурсы открываются.
      ## Если не помогло
      Создайте обращение и укажите текст ошибки, время проверки и тип сети: офис, дом или мобильная точка доступа.
      ## Связанные услуги / типы обращения
      Сеть / VPN.
  - slug: password-reset-before-ticket
    type: article
    space: it-self-service
    title: "Сброс пароля: что проверить перед обращением"
    summary: "Что безопасно проверить перед обращением по паролю."
    visibility: requester
    status: published
    owner: servicedesk
    reviewer: servicedesk
    review_due_days: 90
    tags: [password, access]
    bindings:
      - service_code: access
        offering_code: access.reset_password
        request_template_key: access
        weight: 1.0
    body_format: markdown
    body: |
      ## Назначение
      Помочь понять, нужно ли обращение на сброс пароля.
      ## Когда использовать
      Используйте, если пароль не принимается или вход не завершается.
      ## Шаги
      1. Проверьте раскладку клавиатуры и Caps Lock.
      2. Убедитесь, что вводите актуальный логин.
      3. Если доступен безопасный self-service сброс пароля, используйте его.
      4. Не отправляйте пароль в обращение или чат.
      ## Проверка результата
      Вход выполняется успешно без передачи пароля кому-либо.
      ## Если не помогло
      Создайте обращение и укажите систему, в которую не получается войти, и примерный текст сообщения без пароля.
      ## Связанные услуги / типы обращения
      Доступы / Сброс пароля.
  - slug: mail-basic-diagnostics
    type: article
    space: it-self-service
    title: "Проблемы с почтой: базовая диагностика"
    summary: "Безопасные проверки при проблемах с электронной почтой."
    visibility: requester
    status: published
    owner: servicedesk
    reviewer: servicedesk
    review_due_days: 90
    tags: [mail, email]
    bindings:
      - service_code: mail
        offering_code: mail.mailbox_issue
        request_template_key: mail_issue
        weight: 1.0
    body_format: markdown
    body: |
      ## Назначение
      Помочь собрать первичную информацию о проблеме с почтой.
      ## Когда использовать
      Используйте, если письма не отправляются, не приходят или почтовый клиент показывает ошибку.
      ## Шаги
      1. Проверьте подключение к интернету.
      2. Откройте почту в другом поддерживаемом варианте, если он доступен.
      3. Проверьте, относится ли проблема к одному письму или ко всем письмам.
      4. Убедитесь, что в ящике есть свободное место, если интерфейс это показывает.
      ## Проверка результата
      Почта открывается, новые письма отображаются, отправка проходит без ошибки.
      ## Если не помогло
      Создайте обращение и укажите, что именно не работает: вход, отправка, получение или вложения.
      ## Связанные услуги / типы обращения
      Почта / Проблема с почтой.
  - slug: printer-basic-checks
    type: article
    space: it-self-service
    title: "Принтер не печатает: базовые проверки"
    summary: "Безопасные проверки перед обращением по печати."
    visibility: requester
    status: published
    owner: servicedesk
    reviewer: servicedesk
    review_due_days: 90
    tags: [printer, printing]
    bindings:
      - service_code: workplace
        offering_code: workplace.printer_issue
        request_template_key: printer
        weight: 1.0
    body_format: markdown
    body: |
      ## Назначение
      Помочь исключить простые причины, по которым печать не начинается.
      ## Когда использовать
      Используйте, если документ не печатается или задание долго ожидает.
      ## Шаги
      1. Проверьте, что выбран нужный принтер.
      2. Убедитесь, что на принтере нет видимого сообщения о бумаге или открытой крышке.
      3. Проверьте, печатается ли другой небольшой документ.
      4. Если принтер общий, спросите рядом, печатает ли он у других пользователей.
      ## Проверка результата
      Документ появляется в печати или становится понятно, что проблема общая.
      ## Если не помогло
      Создайте обращение и укажите название принтера, помещение и что видно на экране или панели принтера.
      ## Связанные услуги / типы обращения
      Рабочее место / Принтер.
  - slug: laptop-power-basic
    type: article
    space: it-self-service
    title: "Ноутбук не включается: безопасные шаги"
    summary: "Безопасные действия, если ноутбук не включается."
    visibility: requester
    status: published
    owner: servicedesk
    reviewer: servicedesk
    review_due_days: 90
    tags: [laptop, hardware]
    bindings:
      - service_code: workplace
        offering_code: workplace.laptop_broken
        request_template_key: breakage
        weight: 1.0
    body_format: markdown
    body: |
      ## Назначение
      Помочь проверить питание ноутбука без разборки устройства.
      ## Когда использовать
      Используйте, если ноутбук не подает признаков включения или экран остается черным.
      ## Шаги
      1. Подключите зарядное устройство к розетке и ноутбуку.
      2. Проверьте, есть ли индикатор питания или зарядки.
      3. Подождите несколько минут и попробуйте включить снова.
      4. Не разбирайте устройство и не используйте поврежденные кабели.
      ## Проверка результата
      Ноутбук включается или появляется индикатор питания.
      ## Если не помогло
      Создайте обращение и укажите модель, состояние индикаторов и было ли падение или контакт с жидкостью.
      ## Связанные услуги / типы обращения
      Рабочее место / Сломался ноутбук.
  - slug: unknown-category-describe-problem
    type: article
    space: it-self-service
    title: "Как описать проблему, если не знаете категорию"
    summary: "Как безопасно описать обращение Другое / Не знаю."
    visibility: requester
    status: published
    owner: servicedesk
    reviewer: servicedesk
    review_due_days: 90
    tags: [other, triage]
    bindings:
      - service_code: other
        offering_code: other.unknown
        request_template_key: general_request
        weight: 1.0
    body_format: markdown
    body: |
      ## Назначение
      Помочь создать понятное обращение, если категория неизвестна.
      ## Когда использовать
      Используйте, если не уверены, к какой услуге относится проблема.
      ## Шаги
      1. Коротко опишите, что пытались сделать.
      2. Укажите, что ожидали увидеть.
      3. Укажите, что получилось вместо этого.
      4. Добавьте текст ошибки без паролей, персональных данных и секретной информации.
      ## Проверка результата
      Описание помогает специалисту понять контекст без уточнений.
      ## Если не помогло
      Создайте обращение в категории Другое / Не знаю и приложите безопасное описание.
      ## Связанные услуги / типы обращения
      Другое / Не знаю.
