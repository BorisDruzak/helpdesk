[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths =
    server/tests
    pc_agent/tests
    scripts
norecursedirs =
    .git
    .venvs
    .pytest_cache
    __pycache__
    venv
    build
    dist
    test_modules
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    unit: pure in-process unit tests
    integration: tests that exercise app boundaries or multiple components
    agent_ws: server tests that start the in-process WS agent fixture
    manual: manual or exploratory suites excluded from default CI runs
    no_db: pure unit tests that must not require PostgreSQL fixtures or migrations
