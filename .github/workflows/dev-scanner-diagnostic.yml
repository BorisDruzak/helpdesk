name: DEV-SCANNER diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dev-scanner-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: dev-scanner-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - x64
      - helpdesk-ci
      - scanner
    timeout-minutes: 15

    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo "HOME=${HOME}"
          hostname
          id
          nproc
          free -h
          df -h /

      - name: Checkout exact workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected: ${GITHUB_SHA}"
          echo "Actual:   ${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${GITHUB_SHA}"

      - name: Core tools
        shell: bash
        run: |
          set -euo pipefail
          git --version
          python3 --version
          curl --version | head -1
          docker --version
          docker compose version

      - name: Canonical Node and pnpm
        shell: bash
        run: |
          set -euo pipefail
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          echo "corepack=$(corepack --version)"
          echo "pnpm=$(pnpm --version)"
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "10.33.0"

      - name: Install webapp dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir webapp install --frozen-lockfile --prefer-offline

      - name: Playwright version and Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm --dir webapp exec playwright --version)" = "Version 1.55.0"

          cd webapp
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";

          const executable = chromium.executablePath();
          console.log(`chromium=${executable}`);
          if (!fs.existsSync(executable)) {
            throw new Error(`Chromium executable is missing: ${executable}`);
          }

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          await page.setContent("<title>DEV-SCANNER</title><h1>PASS</h1>");

          const title = await page.title();
          const text = await page.locator("h1").textContent();

          console.log(`title=${title}`);
          console.log(`h1=${text}`);

          if (title !== "DEV-SCANNER" || text !== "PASS") {
            throw new Error("Playwright smoke assertion failed");
          }

          await browser.close();
          console.log("Playwright Chromium smoke: PASS");
          NODE

      - name: Docker execution
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm hello-world > /tmp/docker-hello.txt
          grep -q "Hello from Docker!" /tmp/docker-hello.txt
          echo "Docker execution: PASS"

      - name: GitHub outbound
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 5 --max-time 15 -o /dev/null https://github.com/
          curl -fsS --connect-timeout 5 --max-time 15 -o /dev/null https://api.github.com/
          echo "GitHub outbound: PASS"

      - name: Internal DNS
        shell: bash
        run: |
          set -euo pipefail
          getent hosts sonar.sosnadmin.local
          getent hosts sentry.sosnadmin.local

      - name: SonarQube TLS
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 5 --max-time 15 https://sonar.sosnadmin.local/api/system/status
          echo
          echo "SonarQube TLS: PASS"

      - name: Sentry TLS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 5 --max-time 15 https://sentry.sosnadmin.local/_health/
          echo
          echo "Sentry TLS: PASS"

      - name: Staging network route
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ip route get 192.168.101.118
          echo "Staging route: PASS"
