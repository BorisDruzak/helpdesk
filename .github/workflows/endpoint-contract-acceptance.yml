name: Endpoint contract acceptance

on:
  pull_request:
    paths:
      - "integration/endpoint_contract.lock.json"
      - "scripts/validate_endpoint_contract_lock.py"
      - "server/endpoint_adapter/**"
      - "server/domain_ports/endpoint.py"
      - "server/tests/acceptance/test_endpoint_operations_v1_acceptance.py"
      - ".github/workflows/endpoint-contract-acceptance.yml"
  push:
    branches:
      - codex/endpoint-integration-hardening-v1
    paths:
      - "integration/endpoint_contract.lock.json"
      - "scripts/validate_endpoint_contract_lock.py"
      - "server/endpoint_adapter/**"
      - "server/domain_ports/endpoint.py"
      - "server/tests/acceptance/test_endpoint_operations_v1_acceptance.py"
      - ".github/workflows/endpoint-contract-acceptance.yml"

permissions:
  contents: read

jobs:
  cross-repository-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: endpoint-lock
        name: Read immutable provider lock
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lock = json.loads(Path("integration/endpoint_contract.lock.json").read_text(encoding="utf-8"))
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"repository={lock['provider_repository']}\n")
              handle.write(f"commit={lock['provider_commit']}\n")
          PY

      - name: Checkout locked Endpoint provider
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.endpoint-lock.outputs.repository }}
          ref: ${{ steps.endpoint-lock.outputs.commit }}
          path: endpoint-platform
          # This intentionally uses the ordinary job GITHUB_TOKEN. A private
          # provider inaccessible to it fails here rather than using a secret,
          # fake server, cached checkout, or copied source.

      - name: Install Helpdesk and Endpoint test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt -r endpoint-platform/requirements-ci.txt

      - name: Validate exact provider revision and OpenAPI bytes
        run: |
          python scripts/validate_endpoint_contract_lock.py \
            --lock integration/endpoint_contract.lock.json \
            --provider-root "$GITHUB_WORKSPACE/endpoint-platform"

      - name: Run true provider, Gateway WSS, and Helpdesk evidence acceptance
        env:
          ENDPOINT_PLATFORM_REPO: ${{ github.workspace }}/endpoint-platform
          TEST_DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          python -m pytest \
            server/tests/acceptance/test_endpoint_operations_v1_acceptance.py \
            -m cross_repo_acceptance -q --tb=short
