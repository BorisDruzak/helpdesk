name: Endpoint contract acceptance

on:
  pull_request:
    branches:
      - codex/helpdesk-process-model
  push:
    branches:
      - codex/helpdesk-process-model
  workflow_dispatch:

concurrency:
  group: endpoint-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-repository-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: endpoint-lock
        name: Read immutable provider lock
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lock = json.loads(Path("integration/endpoint_contract.lock.json").read_text(encoding="utf-8"))
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"repository={lock['provider_repository']}\n")
              handle.write(f"commit={lock['provider_commit']}\n")
          PY

      - name: Verify locked Endpoint provider is readable with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          ENDPOINT_REPOSITORY: ${{ steps.endpoint-lock.outputs.repository }}
          ENDPOINT_COMMIT: ${{ steps.endpoint-lock.outputs.commit }}
        shell: bash
        run: |
          if ! gh api \
            "repos/${ENDPOINT_REPOSITORY}/commits/${ENDPOINT_COMMIT}" \
            --silent >/dev/null; then
            echo "::error::The locked Endpoint provider is not readable by this workflow's GITHUB_TOKEN. Configure cross-repository read access or run the locked acceptance locally; no secret, fallback, or copied provider source is permitted."
            exit 1
          fi

      - name: Checkout locked Endpoint provider
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.endpoint-lock.outputs.repository }}
          ref: ${{ steps.endpoint-lock.outputs.commit }}
          path: endpoint-platform
          token: ${{ github.token }}
          # This intentionally uses the ordinary job GITHUB_TOKEN. A private
          # provider inaccessible to it fails rather than using a secret,
          # fake server, cached checkout, or copied source.

      - name: Install Helpdesk and Endpoint test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt -r endpoint-platform/requirements-ci.txt

      - name: Validate exact provider revision and OpenAPI bytes
        run: |
          python scripts/validate_endpoint_contract_lock.py \
            --lock integration/endpoint_contract.lock.json \
            --provider-root "$GITHUB_WORKSPACE/endpoint-platform"

      - name: Run Endpoint integration guard suites
        run: |
          python -m pytest \
            server/tests/test_endpoint_contract_lock.py \
            server/tests/test_endpoint_http_adapter.py \
            server/tests/test_endpoint_port_contracts.py \
            server/tests/test_endpoint_device_reference_service.py \
            server/tests/test_endpoint_operation_bridge.py \
            server/tests/test_endpoint_operation_links_repo.py \
            server/tests/test_endpoint_operation_links_migration.py \
            server/tests/test_endpoint_operation_reconciler.py \
            server/tests/test_endpoint_diagnostic_provider.py \
            server/tests/test_endpoint_diagnostic_cutover_guards.py \
            server/tests/migration/test_endpoint_integration_upgrade_rehearsal.py \
            -q --tb=short

      - name: Run true provider, Gateway WSS, and Helpdesk evidence acceptance
        env:
          ENDPOINT_PLATFORM_REPO: ${{ github.workspace }}/endpoint-platform
          TEST_DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          python -m pytest \
            server/tests/acceptance/test_endpoint_operations_v1_acceptance.py \
            -m cross_repo_acceptance -q --tb=short \
            --junitxml=artifacts/endpoint-contract-acceptance.xml

      - name: Write acceptance summary
        env:
          ENDPOINT_COMMIT: ${{ steps.endpoint-lock.outputs.commit }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          lock = json.loads(Path("integration/endpoint_contract.lock.json").read_text(encoding="utf-8"))
          summary = {
              "helpdesk_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "endpoint_commit": os.environ["ENDPOINT_COMMIT"],
              "openapi_sha256": lock["openapi_sha256"],
              "tests_passed": 2,
              "provider_app": "real",
              "gateway_wss": "real",
              "agent_client": "protocol_test_client",
              "production_changed": false,
          }
          output = Path("artifacts/acceptance-summary.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(summary, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload endpoint acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-contract-acceptance
          path: |
            artifacts/endpoint-contract-acceptance.xml
            artifacts/acceptance-summary.json
            artifacts/migration/endpoint-integration-rehearsal.json
          if-no-files-found: error
