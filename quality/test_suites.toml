# Canonical CI/test-suite catalog for non-server helper checks.

[[suites]]
name = "test_inventory_audit"
runner = "script"
command = ["python", "scripts/audit_test_inventory.py", "--strict"]
database = "none"
description = "Fails the full gate on unknown pytest markers, no_db tests that request DB fixtures, unowned DB tests, or direct live/network client calls in PR suites."

[[suites]]
name = "db_cleanup_profile_audit"
runner = "script"
command = ["python", "scripts/audit_db_cleanup_profiles.py", "--strict"]
database = "none"
description = "Fails the full gate when DB-backed, non-agent-ws server pytest files do not declare an explicit db_cleanup profile."

[[suites]]
name = "fixture_builder_audit"
runner = "script"
command = ["python", "scripts/audit_fixture_builders.py", "--strict"]
database = "none"
description = "Fails the full gate when schema-validated fixture/data packs drift from their JSON Schema builders, source-pack refs, test refs, live evidence requirements, or secret-free contract."

[[suites]]
name = "active_risk_audit"
runner = "script"
command = ["python", "scripts/audit_active_risks.py", "--strict"]
database = "none"
description = "Fails the full gate when active technical-debt risks lose owner, tests, measurable acceptance criteria, evidence refs, or required archive source coverage."

[[suites]]
name = "branch_coverage_audit"
runner = "script"
command = ["python", "scripts/audit_branch_coverage.py", "--strict"]
database = "none"
description = "Fails the full gate when critical pure-logic branch coverage records are missing owners, branch refs, or existing pytest node ids."

[[suites]]
name = "mutation_smoke"
runner = "script"
command = ["python", "scripts/run_mutation_smoke.py"]
database = "none"
description = "Runs targeted temp-workspace mutation smoke for critical pure logic and fails when any configured mutant survives or cannot be collected."

[[suites]]
name = "migration_schema"
runner = "pytest"
paths = ["server/tests/test_migration_schema_contract.py"]
marker_expression = "not manual and not no_db and not agent_ws"
junit = "junit-migration-schema.xml"
database = "isolated-postgres"
description = "Fresh PostgreSQL Alembic migration gate: empty DB upgrade, exact heads, idempotent upgrade, schema/cleanup catalog diff, required constraints/indexes/defaults, and smoke DML."

[[suites]]
name = "scripts_pytest_no_db"
runner = "pytest"
paths = ["scripts/test_*.py"]
marker_expression = "not manual"
junit = "junit-scripts-no-db.xml"
database = "none"
description = "Runs project script tests without DB fixtures before server pytest layers."
