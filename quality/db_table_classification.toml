# DB cleanup schema classification.
#
# The audit in scripts/audit_db_cleanup_schema.py requires every public table to
# match exactly one rule. Runtime tables must be covered by static pytest cleanup
# and by the dynamic reset_test_data.py cleanup policy.

[[rules]]
name = "migration metadata"
classification = "migration_metadata"
tables = ["alembic_version"]
reason = "Alembic owns the schema revision marker."

[[rules]]
name = "partial user and group survivors"
classification = "special_cleanup"
tables = ["access_group_members", "ui_users"]
reason = "Cleanup preserves admin/support survivors and prunes non-survivors with special SQL."

[[rules]]
name = "ticket runtime rows"
classification = "ephemeral_test_data"
tables = [
  "tickets",
  "ticket_action_log",
  "ticket_admin_audit",
  "ticket_approvals",
  "ticket_change_links",
  "ticket_events",
  "ticket_evidence_items",
  "ticket_feedback",
  "ticket_kb_links",
  "ticket_knowledge_links",
  "ticket_links",
  "ticket_notification_prefs",
  "ticket_notifications",
  "ticket_public_sessions",
  "ticket_quality_review_comments",
  "ticket_quality_reviews",
  "ticket_reopen_events",
  "ticket_related_objects",
  "ticket_resolution_passports",
  "ticket_waits",
  "ticket_watchers",
  "ticket_worklogs",
]
reason = "Ticket records, lifecycle logs, public sessions, and quality artifacts are generated per test run."

[[rules]]
name = "knowledge runtime rows"
classification = "ephemeral_test_data"
patterns = ["knowledge_*"]
reason = "Knowledge content, metadata, graph, AI, indexing, and usage rows are mutable test data."

[[rules]]
name = "problem runtime rows"
classification = "ephemeral_test_data"
patterns = ["problem_*"]
tables = ["problems"]
reason = "Problem-management rows are runtime artifacts, excluding none from the current schema."

[[rules]]
name = "change runtime rows"
classification = "ephemeral_test_data"
tables = [
  "change_activity_events",
  "change_affected_objects",
  "change_approvals",
  "change_pir_records",
  "change_plans",
  "change_risk_assessments",
  "change_tasks",
  "change_windows",
  "changes",
]
reason = "Change-management rows are runtime artifacts, excluding none from the current schema."

[[rules]]
name = "registry runtime rows"
classification = "ephemeral_test_data"
patterns = ["registry_*"]
reason = "Registry objects are generated and mutated by tests and live validation flows."

[[rules]]
name = "device runtime rows"
classification = "ephemeral_test_data"
patterns = ["device_*"]
tables = ["devices", "dispatch_ready_devices"]
reason = "Device identity, registration, inventory, pairing, and outbox rows are runtime state."

[[rules]]
name = "operation runtime rows"
classification = "ephemeral_test_data"
tables = ["operation_dependencies", "operations"]
reason = "Operation graph rows are created by agent/server workflows during tests."

[[rules]]
name = "observer runtime rows"
classification = "ephemeral_test_data"
