# Included from nginx's http context. Query strings and headers are not fields.
log_format helpdesk_path_only escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"path":"$uri","status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time}';

server {
    listen 80;
    server_name helpdesk.sosnadmin.local;
    access_log /var/log/nginx/helpdesk.access.log helpdesk_path_only;
    return 308 https://helpdesk.sosnadmin.local$request_uri;
}

server {
    listen 443 ssl;
    server_name helpdesk.sosnadmin.local;
    access_log /var/log/nginx/helpdesk.access.log helpdesk_path_only;
    ssl_certificate /etc/helpdesk/tls/fullchain.pem;
    ssl_certificate_key /etc/helpdesk/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 127.0.0.1;
    allow 192.168.100.0/24;
    allow 192.168.101.0/24;
    deny all;

    # Nginx error messages include the raw request URI on upstream failures.
    # Keep the safe access outcome above and application authentication audits.
    location = /api/web/session/oidc/callback {
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8666;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:8666;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/control/ {
        proxy_pass http://127.0.0.1:8667;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
